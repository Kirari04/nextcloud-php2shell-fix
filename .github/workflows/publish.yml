name: Build, verify and publish patched Nextcloud

on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact Nextcloud release (community builds all three additional releases)
        required: true
        default: community
        type: choice
        options:
          - community
          - all
          - 33.0.10
          - 34.0.4
          - 34.0.5
          - 35.0.2
      publish:
        description: Publish the verified image to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: php2shell-build
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: select
        env:
          RELEASE_SET: ${{ inputs.release }}
        run: python3 scripts/releases.py matrix "$RELEASE_SET" >> "$GITHUB_OUTPUT"
  image:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.variants) }}
    name: Nextcloud ${{ matrix.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kirari04/nextcloud-php2shell-fix
      LOCAL_IMAGE: nextcloud-php2shell:verified
      RELEASE: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select pinned release
        run: python3 scripts/releases.py env "$RELEASE" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Expose Actions cache credentials to Buildx shell steps
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name}`);
              if (name.endsWith('TOKEN')) core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Syntax checks
        run: |
          bash -n build/*.sh scripts/*.sh
          python3 -m py_compile tests/verify-image.py scripts/releases.py
          git diff --check
          mkdir -p "$RUNNER_TEMP/evidence"
      - name: Build and cache patched PHP and extensions
        run: |
          set -o pipefail
          docker buildx build --platform linux/amd64 --target build \
            --build-arg BASE_IMAGE --build-arg EXPECTED_ORIGINAL_PHP --build-arg PATCHED_PHP \
            --build-arg PHP_SOURCE_SHA256 --build-arg DEBIAN_SNAPSHOT \
            --cache-from "type=gha,version=2,scope=nextcloud-php2shell-build-$RELEASE" \
            --cache-to "type=gha,version=2,mode=max,scope=nextcloud-php2shell-build-$RELEASE" \
            --progress plain . 2>&1 | tee "$RUNNER_TEMP/evidence/php-build.log"
      - name: Build patched runtime and run upstream security regressions
        run: |
          set -o pipefail
          docker buildx build --platform linux/amd64 --target runtime --load \
            --build-arg BASE_IMAGE --build-arg BASE_DIGEST --build-arg EXPECTED_ORIGINAL_PHP \
            --build-arg PATCHED_PHP --build-arg PHP_SOURCE_SHA256 --build-arg DEBIAN_SNAPSHOT \
            --build-arg RELEASE_VERSION --build-arg EXPECTED_NEXTCLOUD_VERSION \
            --tag "$LOCAL_IMAGE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --cache-from "type=gha,version=2,scope=nextcloud-php2shell-build-$RELEASE" \
            --cache-from "type=gha,version=2,scope=nextcloud-php2shell-$RELEASE" \
            --cache-to "type=gha,version=2,mode=max,scope=nextcloud-php2shell-$RELEASE" \
            --progress plain . 2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
          id=$(docker create "$LOCAL_IMAGE")
          docker cp "$id:/usr/local/share/php2shell/upstream" "$RUNNER_TEMP/evidence/upstream"
          docker rm -v "$id"
      - name: Verify image contract, Apache security and persistent volume roundtrip
        run: |
          set -o pipefail
          python3 tests/verify-image.py "$LOCAL_IMAGE" --release "$RELEASE_VERSION" --evidence-dir "$RUNNER_TEMP/evidence/integration" \
            2>&1 | tee "$RUNNER_TEMP/evidence/integration.log"
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image and verify registry roundtrip
        if: inputs.publish
        run: |
          set -euo pipefail
          tag="$RELEASE_VERSION-php$PATCHED_PHP-${GITHUB_SHA:0:12}"
          tested_id=$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')
          docker tag "$LOCAL_IMAGE" "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          digest=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')
          test -n "$digest"
          docker pull "$IMAGE@$digest"
          test "$(docker image inspect "$IMAGE@$digest" --format '{{.Id}}')" = "$tested_id"
          docker run --rm --entrypoint php "$IMAGE@$digest" -r 'if (PHP_VERSION !== $argv[1]) exit(1); echo PHP_VERSION, PHP_EOL;' "$PATCHED_PHP"
          for alias in "$RELEASE_VERSION-php$PATCHED_PHP" "$RELEASE_VERSION-apache"; do
            docker tag "$LOCAL_IMAGE" "$IMAGE:$alias"
            docker push "$IMAGE:$alias"
          done
          printf '%s\n' "$IMAGE@$digest" | tee "$RUNNER_TEMP/evidence/published-image.txt"
      - name: Verify public pull without credentials
        if: inputs.publish
        run: |
          set -euo pipefail
          reference=$(cat "$RUNNER_TEMP/evidence/published-image.txt")
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          # First publication may need the owner to change GHCR visibility once.
          # Public visibility is a required release gate, not inferred from repo visibility.
          public=false
          for attempt in {1..20}; do
            if docker --config "$anonymous_config" pull "$reference"; then
              public=true
              break
            fi
            echo 'Awaiting public package visibility: https://github.com/users/Kirari04/packages/container/nextcloud-php2shell-fix/settings'
            sleep 15
          done
          test "$public" = true
          printf 'Anonymous pull passed: %s\n' "$reference" | tee "$RUNNER_TEMP/evidence/public-pull.txt"
          printf 'Verified and publicly available: `%s`\n\nNextcloud %s; PHP %s; linux/amd64.\n' "$reference" "$RELEASE_VERSION" "$PATCHED_PHP" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.release }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: error
